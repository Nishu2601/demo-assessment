name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Run tests
        run: npx jest --coverage --passWithNoTests
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
        if: always()
        
      - name: Generate documentation
        run: npm run docs --if-present
        continue-on-error: true
        
  copilot-ai-check:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run security audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: SonarQube analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=copilot-action-demo_demo-assessment
            -Dsonar.organization=copilot-action-demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        
      - name: Display commit info
        run: |
          echo "Current commit: ${{ github.sha }}"
          echo "Commit short SHA: ${GITHUB_SHA:0:7}"
      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm
      - name: Install dependencies
        run: npm install
      - name: Generate SBOM
        run: cyclonedx-npm --output-file sbom.json
      #- name: Generate SBOM
      #  run: |
      #    npm install -g @cyclonedx/cyclonedx-npm
      #    cyclonedx-npm --output-file sbom.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
        if: always()
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Code quality checks for the commit ${{ github.sha }} got completed! Check the workflow run for detailed results.'
            })
      
  # ==============================================================
  # STAGE 2: Software Composition Analysis (SCA) — Dependency Audit
  # ==============================================================
  sca:
    name: "🛡️ Dependency Audit"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm audit for known vulnerabilities (fail on high/critical)
      - name: npm audit
        run: npm audit --audit-level=high || true
        # `|| true` to not fail on moderate — adjust in prod

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demo-assessment:ci .

      - name: Smoke test container
        run: |
          docker run -d --name copilot-agent -p 3000:3000 \
            -e NODE_ENV=development \
            demo-assessment:ci
          sleep 5
          curl --fail http://localhost:3000/
          docker stop copilot-agent
